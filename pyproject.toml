[project]
name = "rag-multi-hop"
version = "0.1.0"
description = "Multi-hop News QA — RAG over MultiHop-RAG news corpus (FastAPI + pgvector + LangGraph + Vertex AI)"
readme = "README.md"
authors = [
    { name = "srn-source", email = "nonesungsurapon@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.7",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.14",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
default-groups = ["dev", "ingest", "frontend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so tests can `import app...` and `import scripts...`
# (the project is not installed as a package).
pythonpath = ["."]

[tool.ruff]
line-length = 100
# Don't reformat the Python snippets inside our Markdown docs.
extend-exclude = ["*.md"]

[tool.ruff.lint.isort]
# The project is not an installed package, so tell ruff which folders are our code.
known-first-party = ["app", "scripts", "eval"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
frontend = [
    "chainlit>=2.12.0",
]
ingest = [
    "datasets>=5.0.1",
]
